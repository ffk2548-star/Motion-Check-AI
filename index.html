<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MotionCheck AI Pro - Sports Analytics</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700;800&display=swap');

*{
 box-sizing:border-box;
 font-family:'Kanit',sans-serif;
}

body{
 margin:0;
 min-height:100vh;
 background:
 radial-gradient(circle at top,#202938,#05070b);
 color:white;
 padding:20px;
}

.container{
 max-width:1200px;
 margin:auto;
}


.header{
 text-align:center;
 margin-bottom:20px;
}

.header h1{
 font-size:42px;
 font-weight:800;
 font-style:italic;
 color:#ff3b30;
 margin:5px;
}

.header p{
 color:#aaa;
}


.grid{

display:grid;
grid-template-columns:
minmax(300px,650px)
350px;

gap:20px;

justify-content:center;

}


.card{

background:
rgba(20,25,35,.85);

border:
1px solid rgba(255,255,255,.15);

border-radius:18px;

padding:20px;

box-shadow:
0 20px 40px rgba(0,0,0,.5);

}


.video-box{

background:black;

border-radius:15px;

overflow:hidden;

}


canvas{

width:100%;
display:block;

}


video{

display:none;

}



select,input,button{

width:100%;

padding:12px;

margin-top:10px;

border-radius:10px;

border:none;

font-size:16px;

}


input,select{

background:#111827;

color:white;

border:1px solid #374151;

}



button{

cursor:pointer;

font-weight:700;

}



.start{

background:#ff3b30;

color:white;

}



.stop{

background:#222;

color:#ff2a55;

border:1px solid #ff2a55;

}



.stat{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px;

margin-top:15px;

}



.box{

background:#0b1018;

padding:15px;

border-radius:12px;

text-align:center;

border:1px solid #222;

}


.value{

font-size:25px;

font-weight:800;

color:#00f2fe;

}


.safe{

color:#10b981;

}


.warn{

color:#ff9500;

}


.danger{

color:#ff2a55;

}



.progress{

height:15px;

background:#111;

border-radius:10px;

overflow:hidden;

}


.progress div{

height:100%;

background:
linear-gradient(90deg,#ff3b30,#00f2fe);

width:0%;

}



.report{

line-height:1.8;

background:#090d14;

padding:15px;

border-radius:12px;

margin-top:15px;

}


@media(max-width:900px){

.grid{

grid-template-columns:1fr;

}

}

</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>
MotionCheck AI Pro
</h1>

<p>
Professional Multi-Sport Biomechanics Analyzer
</p>

</div>



<div class="grid">


<div class="card">


<div class="video-box">

<video id="video" playsinline></video>

<canvas id="canvas"
width="640"
height="480">
</canvas>

</div>



</div>





<div class="card">


<h2>
⚡ Athlete Control
</h2>


<input
id="athlete"
value="Athlete01"
placeholder="Athlete Name"
>


<select id="sport">


<option value="football">
Football
</option>


<option value="basketball">
Basketball
</option>


<option value="weight">
Weight Training
</option>


<option value="running">
Running
</option>


</select>



<select id="exercise">


<option value="squat">
Squat
</option>


<option value="jump">
Jump Landing
</option>


<option value="balance">
Balance
</option>


</select>



<button
id="start"
class="start">
START ANALYSIS
</button>



<div class="stat">


<div class="box">

REPS

<div id="rep"
class="value">
0
</div>

</div>



<div class="box">

KNEE

<div id="knee"
class="value">
0°
</div>

</div>



<div class="box">

BALANCE

<div id="balance"
class="value">
0%
</div>

</div>



<div class="box">

RISK

<div id="risk"
class="value">
SAFE
</div>

</div>



</div>




<h3>
Performance Score
</h3>


<div class="progress">

<div id="scorebar"></div>

</div>


<h2 id="score">
0 / 100
</h2>



<div class="report"
id="coach">

AI Coach waiting...

</div>



</div>


</div>


</div>



<script>

// ===============================
// PART 2/3
// MediaPipe Pose Engine
// Skeleton + Biomechanics Data
// ===============================


const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");


const repDisplay = document.getElementById("rep");
const kneeDisplay = document.getElementById("knee");
const balanceDisplay = document.getElementById("balance");
const riskDisplay = document.getElementById("risk");

const startBtn = document.getElementById("start");

const scoreBar = document.getElementById("scorebar");
const scoreText = document.getElementById("score");
const coachBox = document.getElementById("coach");



let cameraStarted = false;

let analyzing = false;


// Rep Counter

let reps = 0;
let squatStage = "UP";


// Data Storage

let frameCount = 0;

let safeFrames = 0;

let riskFrames = 0;


let kneeLeftMin = 180;
let kneeRightMin = 180;


let balanceSamples = [];


// ===============================
// Math Functions
// ===============================


function angle(a,b,c){

const radians =
Math.atan2(c.y-b.y,c.x-b.x)
-
Math.atan2(a.y-b.y,a.x-b.x);


let deg =
Math.abs(radians*180/Math.PI);


if(deg>180)
deg=360-deg;


return Math.round(deg);

}



function distance(a,b){

return Math.sqrt(
Math.pow(a.x-b.x,2)+
Math.pow(a.y-b.y,2)
);

}



// ===============================
// Skeleton Drawing
// ===============================


const connections=[

[11,12],

[11,23],
[12,24],

[23,24],

[11,13],
[13,15],

[12,14],
[14,16],


[23,25],
[25,27],

[24,26],
[26,28]

];



function drawSkeleton(points,color){


ctx.lineWidth=4;

ctx.strokeStyle=color;


connections.forEach(pair=>{


let a=points[pair[0]];
let b=points[pair[1]];


if(
a.visibility>0.5 &&
b.visibility>0.5
){

ctx.beginPath();

ctx.moveTo(
a.x*canvas.width,
a.y*canvas.height
);


ctx.lineTo(
b.x*canvas.width,
b.y*canvas.height
);


ctx.stroke();

}


});



points.forEach((p,i)=>{


if(
[11,12,23,24,25,26,27,28].includes(i)
&&
p.visibility>0.5
){


ctx.beginPath();

ctx.arc(
p.x*canvas.width,
p.y*canvas.height,
6,
0,
Math.PI*2
);


ctx.fillStyle="#00f2fe";

ctx.fill();


}


});


}




// ===============================
// Main Pose Result
// ===============================


function onResults(results){


canvas.width =
video.videoWidth || 640;


canvas.height =
video.videoHeight || 480;



ctx.save();


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



ctx.drawImage(
results.image,
0,
0,
canvas.width,
canvas.height
);



if(results.poseLandmarks){


const lm =
results.poseLandmarks;



const leftHip=lm[23];
const rightHip=lm[24];

const leftKnee=lm[25];
const rightKnee=lm[26];

const leftAnkle=lm[27];
const rightAnkle=lm[28];

const leftShoulder=lm[11];
const rightShoulder=lm[12];



// Knee Angle


let lk =
angle(
leftHip,
leftKnee,
leftAnkle
);


let rk =
angle(
rightHip,
rightKnee,
rightAnkle
);



kneeDisplay.innerHTML =
lk+"° / "+rk+"°";




// ===============================
// Squat Rep Detection
// ===============================


let knee =
Math.max(lk,rk);



if(analyzing){


if(knee<100 && squatStage==="UP"){

squatStage="DOWN";

}



if(
knee>155 &&
squatStage==="DOWN"
){

reps++;

repDisplay.innerText=reps;

squatStage="UP";

}



}



// ===============================
// Knee Valgus Detection
// ===============================


let kneeRisk=false;



let kneeDistance =
Math.abs(
leftKnee.x-rightKnee.x
);



let hipDistance =
Math.abs(
leftHip.x-rightHip.x
);



if(
kneeDistance <
hipDistance*0.35
){

kneeRisk=true;

}




// ===============================
// Balance Analysis
// ===============================


let centerX =
(
leftHip.x+
rightHip.x
)/2;



balanceSamples.push(centerX);



if(balanceSamples.length>50)
balanceSamples.shift();



let movement =
Math.max(...balanceSamples)
-
Math.min(...balanceSamples);



let balanceScore =
Math.max(
0,
Math.round(
100-(movement*500)
)
);



balanceDisplay.innerText=
balanceScore+"%";




// ===============================
// Risk Engine
// ===============================


let safe=true;

let color="#10b981";



if(kneeRisk){

safe=false;

color="#ff9500";

riskDisplay.innerText=
"KNEE RISK";

riskDisplay.className="value warn";

}

else{

riskDisplay.innerText=
"SAFE";

riskDisplay.className="value safe";

}



if(analyzing){


frameCount++;


if(safe){

safeFrames++;

}

else{

riskFrames++;

}



if(lk<kneeLeftMin)
kneeLeftMin=lk;


if(rk<kneeRightMin)
kneeRightMin=rk;


}




drawSkeleton(
lm,
color
);



updateScore();


}



ctx.restore();


}



// ===============================
// Performance Score
// ===============================


function updateScore(){


if(frameCount===0)
return;


let safety =
safeFrames/frameCount*100;



let balance =
Number(
balanceDisplay.innerText.replace("%","")
);



let finalScore =
Math.round(
(safety*0.5)+
(balance*0.3)+
(20)
);



finalScore =
Math.min(
100,
finalScore
);



scoreText.innerText=
finalScore+" / 100";


scoreBar.style.width=
finalScore+"%";



}



// ===============================
// MediaPipe Setup
// ===============================


const pose =
new Pose({

locateFile:(file)=>

`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`

});



pose.setOptions({

modelComplexity:1,

smoothLandmarks:true,

enableSegmentation:false,

minDetectionConfidence:0.6,

minTrackingConfidence:0.6

});



pose.onResults(onResults);




// ===============================
// Camera Start
// ===============================


const camera =
new Camera(
video,
{

onFrame:async()=>{

await pose.send({
image:video
});

},


width:640,

height:480

}

);



startBtn.onclick=function(){


if(!cameraStarted){

camera.start();

cameraStarted=true;

}


analyzing=!analyzing;


if(analyzing){

startBtn.innerText=
"STOP ANALYSIS";


startBtn.className="stop";


coachBox.innerText=
"AI is analyzing movement...";


}

else{


startBtn.innerText=
"START ANALYSIS";


startBtn.className="start";


coachBox.innerText=
"Analysis paused. Waiting for report...";


}



};
// ===============================
// PART 3/3
// AI Coach + Injury Risk + Report
// ===============================


const sportSelect =
document.getElementById("sport");

const exerciseSelect =
document.getElementById("exercise");



// เก็บข้อมูล Session

let sessionData = {

sport:"",
exercise:"",
reps:0,
score:0,
risk:"",
coach:""

};




// ===============================
// Injury Risk AI
// ===============================


function calculateInjuryRisk(){


let kneeRiskPercent = 0;


if(riskFrames > safeFrames){

kneeRiskPercent = 70;

}

else if(riskFrames > 0){

kneeRiskPercent = 35;

}

else{

kneeRiskPercent = 10;

}




let balance =
Number(
balanceDisplay.innerText.replace("%","")
);



let balanceRisk = 
100-balance;



let totalRisk =
Math.round(
(kneeRiskPercent*0.6)+
(balanceRisk*0.4)
);



let level="LOW";


if(totalRisk>65){

level="HIGH";

}
else if(totalRisk>35){

level="MEDIUM";

}



return {

score:totalRisk,

level:level

};


}



// ===============================
// AI Coach Generator
// ===============================


function generateCoach(){


let injury =
calculateInjuryRisk();



let exercise =
exerciseSelect.value;



let message="";



if(injury.level==="HIGH"){


message=

`
⚠ AI COACH REPORT

Overall Risk:
HIGH

พบความผิดปกติของแนวเข่า
และความเสถียรของร่างกาย

คำแนะนำ:

- ลดความเร็วการเคลื่อนไหว
- ควบคุมแนวเข่าเหนือปลายเท้า
- ฝึก Balance เพิ่มเติม

`;



}

else if(injury.level==="MEDIUM"){


message=

`
🟡 AI COACH REPORT

Risk:
MEDIUM


ฟอร์มโดยรวมดี
แต่พบช่วงการเคลื่อนไหวที่ควรปรับปรุง


คำแนะนำ:

- รักษาสมดุลซ้ายขวา
- เพิ่มการควบคุมช่วงลงน้ำหนัก

`;



}

else{


message=

`
🟢 AI COACH REPORT

Performance:
GOOD


จุดแข็ง:

✓ Body Stability
✓ Movement Control
✓ Safe Technique


รักษารูปแบบการฝึกนี้ต่อไป

`;



}



coachBox.innerHTML =
message;



return message;


}





// ===============================
// Session Summary
// ===============================


function finishAnalysis(){


if(frameCount===0){

return;

}



let finalScore =
Number(
scoreText.innerText.split("/")[0]
);



let injury =
calculateInjuryRisk();



let coach =
generateCoach();



sessionData={


date:
new Date().toLocaleString("th-TH"),


athlete:
document.getElementById("athlete").value,


sport:
sportSelect.value,


exercise:
exerciseSelect.value,


reps:reps,


score:finalScore,


risk:injury.level,


coach:coach


};



saveHistory();



}





// ===============================
// Local History
// ===============================


function saveHistory(){


let history =
JSON.parse(
localStorage.getItem(
"MotionCheckAI"
)
||
"[]"
);



history.unshift(sessionData);



localStorage.setItem(

"MotionCheckAI",

JSON.stringify(history)

);



}



// ===============================
// Override Stop Detection
// ===============================


startBtn.addEventListener(
"click",
()=>{


if(!analyzing){


setTimeout(()=>{


finishAnalysis();


},500);



}


}

);




// ===============================
// Multi Sport Adjustment
// ===============================


sportSelect.addEventListener(
"change",
()=>{


let sport =
sportSelect.value;



if(sport==="football"){


coachBox.innerHTML=
`
⚽ Football Mode

Focus:

- Knee Stability
- Landing Control
- Lower Body Power

`;

}


if(sport==="basketball"){


coachBox.innerHTML=
`
🏀 Basketball Mode

Focus:

- Jump Landing
- Knee Alignment
- Balance

`;

}



if(sport==="weight"){


coachBox.innerHTML=
`
🏋 Weight Training Mode

Focus:

- Squat Depth
- Joint Safety
- Symmetry

`;

}



if(sport==="running"){


coachBox.innerHTML=
`
🏃 Running Mode

Focus:

- Body Balance
- Leg Symmetry
- Posture

`;

}



}

);



</script>


</body>

</html>
